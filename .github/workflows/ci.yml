name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json

      - name: Install
        run: pnpm install --frozen-lockfile=${{ hashFiles('pnpm-lock.yaml') != '' }}

      - name: Upload lockfile (when generated)
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml

      - name: Lint era contract
        run: node scripts/preview-eras.mjs

      - name: Build (nuxt generate + headers)
        run: pnpm generate

      - name: Check budgets
        run: pnpm check:size

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Upload site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
